version: "3.9"

services:
  task-api:
    build:
      context: .
      dockerfile: TaskService/Task.Api/Dockerfile
    image: tasktracker-task-api:local
    container_name: tasktracker_task_api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    restart: unless-stopped
    depends_on:
      - rabbitmq
    networks:
      - task-net

  user-api:
    build:
      context: .
      dockerfile: UserService/User.Api/Dockerfile
    image: tasktracker-user-api:local
    container_name: tasktracker_user_api
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    restart: unless-stopped
    depends_on:
      - rabbitmq
    networks:
      - task-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tasktracker_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - task-net

networks:
  task-net:
    driver: bridge
